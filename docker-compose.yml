services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: lakehouse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - lakehouse-network

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: lakehouse-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-password123}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\";
      mc mb --ignore-existing local/\"$${WAREHOUSE_BUCKET}\";
      mc anonymous set none local/\"$${WAREHOUSE_BUCKET}\";
      "
    networks:
      - lakehouse-network

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: lakehouse-iceberg-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-admin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      CATALOG_WAREHOUSE: s3://${WAREHOUSE_BUCKET:-warehouse}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    networks:
      - lakehouse-network

  app:
    build: .
    container_name: lakehouse-duckdb-app
    depends_on:
      - iceberg-rest
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: ${WAREHOUSE_BUCKET:-warehouse}
    volumes:
      - ./app:/app/app
      - lakehouse_data:/app/lakehouse
    networks:
      - lakehouse-network
    command: ["python", "-m", "app.main"]

  jupyter:
    build: .
    container_name: lakehouse-jupyter
    depends_on:
      - iceberg-rest
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-password123}
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: ${WAREHOUSE_BUCKET:-warehouse}
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-lakehouse}
    ports:
      - "8888:8888"
    volumes:
      - ./app:/app/app
      - ./notebooks:/app/notebooks
    command:
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --NotebookApp.token=${JUPYTER_TOKEN:-lakehouse}
    networks:
      - lakehouse-network

volumes:
  minio-data:
    driver: local
  lakehouse_data:
    driver: local

networks:
  lakehouse-network:
    driver: bridge